function money(n){return new Intl.NumberFormat('fr-CA',{style:'currency',currency:'CAD',maximumFractionDigits:0}).format(Number(n||0));}
function num(n){return new Intl.NumberFormat('fr-CA').format(Number(n||0));}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function provinceCode(name){return ({'Québec':'QC','Ontario':'ON','Alberta':'AB','Manitoba':'MB','Nouveau-Brunswick':'NB'})[name] || 'QC';}
function salaryForProfile(){const d=salaryData[profile.profession] || salaryData['Comptable']; return d[provinceCode(profile.province)] || d.QC;}
function netEstimate(gross, prov='QC'){const rate={QC:.70,ON:.73,AB:.75,MB:.72,NB:.71}[prov]||.72;return Math.round(gross*rate);}
function opportunityCount(){const base={'Comptable':428,'Infirmier(ère)':1120,'Développeur logiciel':864,'Électromécanicien':612}[profile.profession]||520; return base;}

function slideShell(kicker,title,body,extra='',cls=''){
  return `<article class="deck-slide ${cls}"><div class="slide-inner"><div class="kicker">${kicker}</div><h1>${title}</h1>${body?`<p class="lead">${body}</p>`:''}${extra}</div></article>`;

function field(id,label,type,value,options=[]){
  if(type==='select') return `<label class="field"><span>${label}</span><select id="${id}">${options.map(o=>`<option ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`;
  return `<label class="field"><span>${label}</span><input id="${id}" type="${type}" value="${esc(value)}" /></label>`;
}

  return [
    slideShell('VOIES D’IMMIGRATION','Une destination. Plusieurs chemins.','Le développeur d’affaires peut présenter les grandes voies sans transformer l’outil en conseil juridique automatisé.',`<div class="route-grid">${routes.map(x=>`<button class="route-card ${x.id===selectedRoute?'selected':''}" data-route="${x.id}"><span>${x.tag}</span><strong>${x.name}</strong><small>${x.fit}</small></button>`).join('')}</div>`),
    slideShell(`VOIE · ${r.name}`,r.name,`Pour qui ? ${r.fit}.`,`<div class="grid-2"><div class="panel"><h3>Points positifs</h3><ul class="plus-list">${r.positives.map(x=>`<li>✓ ${x}</li>`).join('')}</ul></div><div class="panel"><h3>Points d’attention</h3><ul class="warn-list">${r.attention.map(x=>`<li>⚠ ${x}</li>`).join('')}</ul></div></div>`),
    slideShell(`VOIE · ${r.name} · ÉTAPES`,'Comprendre les étapes avant de commencer','Une timeline simple pour montrer l’effort, les dépendances et l’ordre logique.',timeline(r.steps))
  ];
}

function compareSlides(){
  return [
    slideShell('COMPARATEUR DE PROCÉDURES','Comparer les voies côte à côte.','Sélectionnez jusqu’à trois procédures pour aider le prospect à comprendre leurs différences.',`<div class="compare-select">${routes.map(r=>`<label><input type="checkbox" data-compare="${r.id}" ${compareSelected.includes(r.id)?'checked':''}> ${r.name}</label>`).join('')}</div>${procedureTable()}`),
    slideShell('COMPARATEUR · SCÉNARIOS',smart('Quel scénario correspond le mieux à {name} ?'),'Le commercial choisit une logique de projet plutôt qu’un programme au hasard.',`<div class="scenario-grid"><div><span>A</span><h3>Aller vers la résidence permanente</h3><p>Explorer d’abord les voies économiques directes.</p></div><div><span>B</span><h3>Construire une expérience canadienne</h3><p>Études ou travail selon les conditions applicables.</p></div><div><span>C</span><h3>Maximiser l’employabilité</h3><p>Province + métier + carrière + immigration.</p></div><div><span>D</span><h3>Partir en famille</h3><p>Comparer coût, emploi du conjoint et installation.</p></div></div>`)
  ];
}
function procedureTable(){const rs=routes.filter(r=>compareSelected.includes(r.id)).slice(0,3);return `<table class="compare-table procedure-table"><thead><tr><th>Critère</th>${rs.map(r=>`<th>${r.name}</th>`).join('')}</tr></thead><tbody>${[
  ['Objectif',...rs.map(r=>r.tag)],['Profil type',...rs.map(r=>r.fit)],['Complexité',...rs.map((r,i)=>'●'.repeat(3+(i%2)))],['Investissement','$$','$$$$','$$'],['Résidence permanente','Potentiellement','Non immédiate','Potentiellement'],['Points forts',...rs.map(r=>r.positives[0])],['Attention',...rs.map(r=>r.attention[0])]
].map(row=>`<tr>${row.map((c,i)=>`<td>${i===0?`<strong>${c}</strong>`:c||'Variable'}</td>`).join('')}</tr>`).join('')}</tbody></table>`;}

function failureSlides(){return [
  slideShell('ÉCHECS FRÉQUENTS','Les erreurs qui coûtent du temps, de l’argent et parfois plusieurs années.','Cette section sert à créer le contraste entre “faire quelque chose” et “faire les bonnes choses dans le bon ordre”.',`<div class="risk-grid">${['Choisir un programme pour le visa au lieu du projet','Déposer trop vite','Sous-estimer les preuves financières','Ignorer l’employabilité','Arriver sans logement préparé','Croire qu’un emploi est garanti','Suivre des conseils non autorisés','Attendre que tout soit urgent'].map(x=>`<div class="risk-card"><b>×</b><span>${x}</span></div>`).join('')}</div>`),
  slideShell('ÉCHECS FRÉQUENTS · MESSAGE','Le problème n’est pas toujours votre profil.','Souvent, c’est la stratégie, le calendrier ou l’absence de préparation.',`<div class="quote-card big">« Une bonne décision prise tôt coûte souvent moins cher qu’une mauvaise décision corrigée tard. »</div>`)
];}

function ecosystemSlides(){return [
  slideShell('ÉCOSYSTÈME IR','Nous ne nous arrêtons pas au dossier.','IR réunit immigration, emploi et installation dans une même logique de projet.',`<div class="eco-grid"><div><div class="eco-icon">🛂</div><h3>IR Immigration</h3><p>Stratégie et accompagnement immigration.</p></div><div><div class="eco-icon">💼</div><h3>Industrielle RH</h3><p>Emploi, préparation carrière et réseau.</p></div><div><div class="eco-icon">🏠</div><h3>IR Conciergerie</h3><p>Logement, accueil, démarches et installation.</p></div></div>`),
  slideShell('ÉCOSYSTÈME IR · PROMESSE','Un seul interlocuteur pour construire tout le projet.','Le prospect comprend enfin ce qui différencie IR d’un simple prestataire administratif.',`<div class="quote-card big">Immigration + Emploi + Installation = Projet Canada structuré</div>`)
];}

function journeySlides(){return [
  slideShell('NOTRE ACCOMPAGNEMENT','Votre projet, étape par étape.','Le développeur d’affaires peut expliquer la méthode sans jargon.',timeline(['Analyse','Stratégie','Documents','Dépôt / suivi','Carrière','Installation'])),
  slideShell('NOTRE ACCOMPAGNEMENT · PERSONNALISÉ',smart('{name}, votre parcours ne sera pas identique à celui d’un autre client.'),smart('Votre métier, votre budget, votre famille, votre province et votre objectif {objective} changent la stratégie.'),`<div class="summary-cards">${[['Métier',profile.profession],['Province',profile.province],['Famille',profile.family],['Budget',money(profile.budget)]].map(x=>`<div class="summary-card"><span>${x[0]}</span><strong>${esc(x[1])}</strong></div>`).join('')}</div>`)
];}

function offerSlides(){return [
  slideShell('OFFRES & PRIX','Présenter l’offre au bon moment.','Le prospect a déjà vu le rêve, le marché, les risques et la méthode. Maintenant le prix a du contexte.',`<div class="offer-grid"><div><span>Visa</span><strong>À partir de 1 500 $</strong><p>Préparation et suivi du dossier selon mandat.</p></div><div><span>Affaires</span><strong>À partir de 2 500 $</strong><p>Visa d’affaires et options VIP.</p></div><div><span>Études</span><strong>Sur évaluation</strong><p>Programme, admission, permis et préparation.</p></div><div><span>Résidence permanente</span><strong>Sur évaluation</strong><p>Stratégie, dossier et accompagnement.</p></div></div>`),
  slideShell('OFFRES & PRIX · PROPOSITION',smart('Construire la proposition de {name}.'),smart('Projet : {objective}. Province : {province}. Budget déclaré : '+money(profile.budget)+'.'),`<div class="proposal-box"><div><span>Accompagnement proposé</span><strong>Immigration + carrière + installation</strong></div><div><span>Investissement de travail</span><strong>${money(Math.min(Math.max(profile.budget*.5,5000),12000))}</strong></div><button class="primary-btn" data-goto="paiement">Construire l’échéancier</button></div>`)
];}

function paymentSlides(){return [
  slideShell('PAIEMENT ÉCHELONNÉ','Rendre le projet financièrement plus respirable.','Le commercial peut construire un échéancier devant le prospect.',installments(Math.min(Math.max(profile.budget*.5,5000),12000))),
  slideShell('PAIEMENT ÉCHELONNÉ · MESSAGE','Vous n’avez pas à tout payer le même jour.','L’idée est de faire avancer le paiement en même temps que le projet, selon les modalités approuvées.',`<div class="quote-card big">« Un grand projet peut être découpé en étapes claires. »</div>`)
];}
function installments(total){const a=Math.round(total*.2),b=Math.round(total*.2),c=Math.round(total*.3),d=total-a-b-c;return `<div class="installment-grid">${[['Aujourd’hui',a],['Étape 2',b],['Étape 3',c],['Étape 4',d]].map(x=>`<div><span>${x[0]}</span><strong>${money(x[1])}</strong></div>`).join('')}</div><div class="total-line"><span>Total</span><strong>${money(total)}</strong></div>`;}

function earlySlides(){return [
  slideShell('COMMENCER TÔT','Le temps peut devenir un avantage.','Commencer ne veut pas dire déposer demain. Cela veut dire préparer aujourd’hui ce qui prendra du temps.',`<div class="timeline-simple"><div><span>Maintenant</span><b>Langue, documents, CV, budget</b></div><div><span>Dans quelques mois</span><b>Profil plus solide</b></div><div><span>Quand l’opportunité arrive</span><b>Projet prêt à avancer</b></div></div>`),
  slideShell('COMMENCER TÔT · CONTRASTE','12 mois passent dans les deux cas.','La différence est ce que vous faites de ces 12 mois.',`<div class="two-futures"><div><span>ATTENDRE</span><h3>Questions</h3><p>Peu de préparation, décisions tardives.</p></div><div class="active"><span>PRÉPARER</span><h3>Progression</h3><p>Documents, compétences, finances, stratégie.</p></div></div>`)
];}

function objectionSlides(){return [
  slideShell('OBJECTIONS','Le commercial ne cherche plus ses arguments.','Chaque objection importante dispose de son écran de preuve.',`<div class="objection-grid">${['C’est trop cher','Je peux le faire seul','Je dois réfléchir','Je n’ai pas l’argent maintenant','Comment vous faire confiance ?','Et si je ne trouve pas d’emploi ?'].map(x=>`<button>${x}</button>`).join('')}</div>`),
  slideShell('OBJECTION · PRIX','Combien coûte réellement une mauvaise décision ?','Le but n’est pas de faire peur. Le but est de remettre le prix dans le contexte du projet complet.',`<div class="risk-grid">${['Mauvais programme','Refus évitable','Année perdue','Mauvais logement','Arrivée sans emploi','Démarches à recommencer'].map(x=>`<div class="risk-card"><b>×</b><span>${x}</span></div>`).join('')}</div>`)
];}

function closingSlides(){
  const price=Math.min(Math.max(profile.budget*.5,5000),12000);
  return [
    slideShell('CLOSING',smart('{name}, voici le projet que nous pouvons construire avec vous.'),'La plateforme résume automatiquement les informations importantes.',`<div class="closing-summary"><div><span>Objectif</span><strong>${esc(profile.objective)}</strong></div><div><span>Métier</span><strong>${esc(profile.profession)}</strong></div><div><span>Province</span><strong>${esc(profile.province)}</strong></div><div><span>Investissement de travail</span><strong>${money(price)}</strong></div></div><div class="cta-block"><button class="primary-btn">Oui, commençons</button><button class="ghost-btn">Recevoir la proposition</button><button class="ghost-btn">Planifier un suivi</button></div>`),
    slideShell('CLOSING · PROCHAINE ÉTAPE','Transformer la décision en action.','Dans la version connectée : créer la proposition, générer le lien de paiement, envoyer le contrat et créer le suivi CRM.',`<div class="closing-actions"><div>📄<strong>Proposition</strong></div><div>✍️<strong>Contrat</strong></div><div>💳<strong>Paiement</strong></div><div>💬<strong>WhatsApp</strong></div><div>📧<strong>Courriel</strong></div><div>📊<strong>CRM</strong></div></div>`)
  ];
}
function documentsSlides(){return [slideShell('DOCUMENTS','Tous les documents commerciaux au même endroit.','Le développeur d’affaires ne cherche plus ses PDF pendant la rencontre.',`<div class="doc-grid">${['Offre Visa','Offre Études','Offre Affaires','Offre Conciergerie','Résidence permanente','Brochure IR','Présentation entreprise','Contrat','FAQ'].map(x=>`<button>📄 <strong>${x}</strong><span>Ouvrir / envoyer</span></button>`).join('')}</div>`)]}

function liveStats(){return `<div class="stats-grid">${[['Postes vacants','509 100','Source démo'],['Taux de chômage','6,4 %','Source démo'],['Salaire moyen','1 343 $ / semaine','Source démo'],['Admissions prévues','380 000','Source démo']].map(s=>`<div class="stat-card"><span>${s[0]}</span><strong>${s[1]}</strong><small>${s[2]}</small><em>● Données connectables</em></div>`).join('')}</div>`;}
function lineChart(){return `<div class="line-chart"><svg viewBox="0 0 500 180" preserveAspectRatio="none"><line class="grid" x1="0" y1="60" x2="500" y2="60"/><line class="grid" x1="0" y1="120" x2="500" y2="120"/><polyline class="series" points="0,130 55,123 110,108 165,96 220,103 275,85 330,74 385,83 440,68 500,76"/>${[[0,130],[110,108],[220,103],[330,74],[440,68],[500,76]].map(([x,y])=>`<circle class="dot" cx="${x}" cy="${y}" r="4"/>`).join('')}</svg></div>`;}
function barChart(){const vals=[['QC',62],['ON',91],['AB',74],['BC',54],['MB',37],['NB',25],['NS',24]];return `<div class="chart">${vals.map(([l,v])=>`<div class="bar" style="height:${v}%"><label>${l}</label></div>`).join('')}</div>`;}
function timeline(steps){return `<div class="timeline">${steps.map((s,i)=>`<div class="timeline-step"><div class="step-dot">${i+1}</div><h4>${esc(s)}</h4></div>`).join('')}</div>`;}

const sections = [
  {id:'profile',label:'Profil client',icon:'user',slides:profileSlides},
  {id:'pitch',label:'Pitch',icon:'play',slides:pitchSlides},
  {id:'canada',label:'Canada Live',icon:'activity',slides:canadaSlides},
  {id:'opportunites',label:'Opportunités',icon:'sparkles',slides:opportunitySlides},
  {id:'emplois',label:'Emplois',icon:'briefcase',slides:jobsSlides},
  {id:'salaires',label:'Guide salarial',icon:'dollar',slides:salarySlides},
  {id:'calculateurs',label:'Calculateurs',icon:'calculator',slides:calculatorSlides},
  {id:'provinces',label:'Provinces',icon:'map',slides:provinceSlides},
  {id:'voies',label:'Voies d’immigration',icon:'route',slides:routeSlides},
  {id:'comparateur',label:'Comparateur de procédures',icon:'compare',slides:compareSlides},
  {id:'echecs',label:'Échecs fréquents',icon:'alert',slides:failureSlides},
  {id:'ecosysteme',label:'Écosystème IR',icon:'layers',slides:ecosystemSlides},
  {id:'etapes',label:'Notre accompagnement',icon:'steps',slides:journeySlides},
  {id:'offres',label:'Offres & prix',icon:'tag',slides:offerSlides},
  {id:'paiement',label:'Paiement échelonné',icon:'card',slides:paymentSlides},
  {id:'commencer',label:'Commencer tôt',icon:'clock',slides:earlySlides},
  {id:'objections',label:'Objections',icon:'message',slides:objectionSlides},
  {id:'closing',label:'Closing',icon:'check',slides:closingSlides},
  {id:'documents',label:'Documents',icon:'doc',slides:documentsSlides}
];

function currentSlides(){return sections[currentSectionIndex].slides();}
function renderNav(){
  const nav=document.getElementById('navItems');
  nav.innerHTML=sections.map((s,i)=>`<button class="nav-item ${i===currentSectionIndex?'active':''}" data-index="${i}" data-label="${esc(s.label)}" aria-label="${esc(s.label)}">${iconSvg(s.icon)}</button>`).join('');
  nav.querySelectorAll('.nav-item').forEach(btn=>btn.addEventListener('click',()=>goToSection(Number(btn.dataset.index))));
}
function renderProgress(){
  const slides=currentSlides();
  document.getElementById('progressDots').innerHTML=slides.map((_,i)=>`<button class="progress-dot ${i===currentSlideIndex?'active':''}" data-slide="${i}" aria-label="Page ${i+1}"></button>`).join('');
  document.getElementById('progressDots').querySelectorAll('.progress-dot').forEach(b=>b.addEventListener('click',()=>goToSlide(Number(b.dataset.slide))));
  document.getElementById('pageCount').textContent=`${currentSlideIndex+1} / ${slides.length}`;
  document.getElementById('sectionCount').textContent=`${currentSectionIndex+1} / ${sections.length} · ${sections[currentSectionIndex].label}`;
  document.getElementById('prevPage').disabled=currentSlideIndex===0;
  document.getElementById('nextPage').disabled=currentSlideIndex===slides.length-1;
}
function goToSection(i){currentSectionIndex=Math.max(0,Math.min(sections.length-1,i));currentSlideIndex=0;renderAll('section');}
function goToSlide(i){const slides=currentSlides();currentSlideIndex=Math.max(0,Math.min(slides.length-1,i));renderStage(i>currentSlideIndex?'right':'left');renderProgress();}
function nextSlide(){const slides=currentSlides();if(currentSlideIndex<slides.length-1){currentSlideIndex++;renderStage('right');renderProgress();}}
function prevSlide(){if(currentSlideIndex>0){currentSlideIndex--;renderStage('left');renderProgress();}}
function renderStage(direction='right'){
  const stage=document.getElementById('stage');
  const slides=currentSlides();
  stage.innerHTML=`<div class="slide-viewport"><div class="slide-motion ${direction==='left'?'from-left':'from-right'}">${slides[currentSlideIndex]}</div></div>`;
  bindSlideEvents();
}
function renderAll(){renderNav();renderStage();renderProgress();}

function bindSlideEvents(){
  document.querySelectorAll('[data-goto]').forEach(b=>b.addEventListener('click',()=>{const idx=sections.findIndex(s=>s.id===b.dataset.goto);if(idx>=0)goToSection(idx);}));
  document.querySelectorAll('[data-route]').forEach(b=>b.addEventListener('click',()=>{selectedRoute=b.dataset.route;renderStage();renderProgress();}));
  document.querySelectorAll('[data-compare]').forEach(c=>c.addEventListener('change',()=>{
    const id=c.dataset.compare;
    if(c.checked && !compareSelected.includes(id) && compareSelected.length<3) compareSelected.push(id);
    if(!c.checked) compareSelected=compareSelected.filter(x=>x!==id);
    renderStage(); renderProgress();
  }));
  const save=document.getElementById('saveProfile'); if(save) save.addEventListener('click',saveProfile);
  const reset=document.getElementById('resetProfile'); if(reset) reset.addEventListener('click',()=>{profile={...defaultProfile};localStorage.setItem('irProfile',JSON.stringify(profile));renderAll();});
  const gross=document.getElementById('grossCalc'),prov=document.getElementById('provCalc');
  if(gross&&prov){const calc=()=>{const n=netEstimate(Number(gross.value||0),prov.value);document.getElementById('netResult').textContent=money(n);document.getElementById('netMonthly').textContent=`≈ ${money(n/12)} / mois`;};gross.addEventListener('input',calc);prov.addEventListener('change',calc);}
}
function saveProfile(){
  ['firstName','country','age','profession','experience','education','french','english','family','objective','budget','province','start'].forEach(id=>{const el=document.getElementById(id);if(el) profile[id]=(el.type==='number'?Number(el.value):el.value);});
  localStorage.setItem('irProfile',JSON.stringify(profile));
  renderAll();
  setTimeout(()=>{const b=document.querySelector('.smart-preview');if(b){b.classList.add('flash');setTimeout(()=>b.classList.remove('flash'),700)}},20);
}

document.getElementById('prevPage').addEventListener('click',prevSlide);
document.getElementById('nextPage').addEventListener('click',nextSlide);
document.getElementById('clientModeBtn').addEventListener('click',()=>{clientMode=!clientMode;document.body.classList.toggle('client-mode',clientMode);document.getElementById('clientModeBtn').textContent=clientMode?'Mode commercial':'Mode client';});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')nextSlide(); if(e.key==='ArrowLeft')prevSlide(); if(e.key==='ArrowDown'&&e.altKey)goToSection(currentSectionIndex+1); if(e.key==='ArrowUp'&&e.altKey)goToSection(currentSectionIndex-1);});

renderAll();

</script>
</body>
</html>
